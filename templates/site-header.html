<!-- shared:site-header -->
<div class="{{NAV_VARIANT}} fixed left-1/2 -translate-x-1/2 w-[90%] max-w-[800px] z-50 top-[1.2em] md:top-[2em]" data-nav>
    <nav class="nav-card">
        <div class="nav-row h-[60px] flex items-center justify-between px-3">
            <button type="button" class="hamburger p-2 -ml-1 cursor-pointer" data-nav-toggle aria-label="Open menu"
                aria-expanded="false" aria-controls="nav-links">
                <span></span><span></span><span></span>
            </button>
            <a href="{{BRAND_HREF}}" class="header-logo" aria-label="Back to portfolio">
                <img class="header-logo__light" src="/assets/img/logo-light.svg" alt="Bala logo" width="32" height="32">
                <img class="header-logo__dark" src="/assets/img/logo-dark.svg" alt="" width="32" height="32" aria-hidden="true">
            </a>
            <div class="nav-actions">
                {{VIEW_TOGGLE}}
                {{RESUME_ACTION}}
                <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
                    <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                    <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
                </button>
            </div>
        </div>
        <div class="nav-panel px-3" id="nav-links">
            <ul class="font-hand text-2xl py-2 flex flex-col md:flex-row md:justify-center gap-1 md:gap-6">
                {{NAV_LINKS}}
            </ul>
        </div>
    </nav>
</div>
<!-- /shared:site-header -->
